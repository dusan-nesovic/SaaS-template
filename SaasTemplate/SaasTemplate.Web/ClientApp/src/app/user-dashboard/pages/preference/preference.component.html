<app-cms-content [title]="'MENU.PREFERENCE' | translate" [description]="'PAGE_SUB.PREFERENCE' | translate">
  <div class="panel pref-panel">
    <div class="panel-body">
      <div class="pref-row">
        <div class="pref-copy">
          <span class="pref-label">{{ 'THEME' | translate }}</span>
          <span class="pref-hint">{{ 'PREFERENCE.THEME_HINT' | translate }}</span>
        </div>

        <app-select class="pref-control" [(ngModel)]="selectedTheme" [options]="themeOptions"></app-select>
      </div>

      <div class="pref-row">
        <div class="pref-copy">
          <span class="pref-label">{{ 'LANGUAGE' | translate }}</span>
          <span class="pref-hint">{{ 'PREFERENCE.LANGUAGE_HINT' | translate }}</span>
        </div>

        <app-select class="pref-control" [(ngModel)]="selectedLanguage" [options]="languageOptions"></app-select>
      </div>

      <div class="pref-actions">
        <button class="btn primary" type="button" [disabled]="!hasChanges" (click)="onSave()">{{ 'SAVE' | translate }}</button>
      </div>
    </div>
  </div>
</app-cms-content>
