@if (!isAuthenticated) {
  <div class="studio-blocked">
    <h2>{{ 'UNAUTHORIZED_ACCESS' | translate }}</h2>
  </div>
} @else {
  <div class="studio" [class.is-collapsed]="isSidebarCollapsed">
    <!-- Only on a phone, where the sidebar collapses away. -->
    <header class="studio-topbar">
      <button type="button" class="studio-burger" (click)="toggleSidebar()" [attr.aria-label]="'MENU.TOGGLE' | translate" [attr.aria-expanded]="!isSidebarCollapsed">
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>

      <a class="studio-brand-name" routerLink="/">{{ appName }}</a>
    </header>

    <aside class="studio-sidebar">
      <a class="studio-brand" routerLink="/">
        <span class="studio-brand-mark" aria-hidden="true">{{ appName.charAt(0) }}</span>
        <span class="studio-brand-text">
          <span class="studio-brand-name">{{ appName }}</span>
          <span class="studio-brand-sub">{{ 'APP_SUBTITLE' | translate }}</span>
        </span>
      </a>

      <nav class="studio-nav" [attr.aria-label]="'MENU.LABEL' | translate">
        @for (item of menuItems; track item.url) {
          @if (item.condition) {
            <button type="button" class="studio-nav-item" [class.is-active]="item.active" (click)="onNavigate(item.url)">
              <i [class]="item.icon" aria-hidden="true"></i>
              <span>{{ item.label }}</span>
            </button>
          }
        }
      </nav>

      <div class="studio-sidebar-foot">
        <button type="button" class="studio-logout" (click)="onLogout()">
          <i class="pi pi-sign-out" aria-hidden="true"></i>
          {{ 'LOGOUT' | translate }}
        </button>
      </div>
    </aside>

    <main class="studio-main">
      <router-outlet></router-outlet>
    </main>
  </div>
}
