@if (visible) {
  <!-- Keyboard users close the modal with Escape (document listener in the component). -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal" [style.width]="width" role="dialog" aria-modal="true">
      @if (title) {
        <div class="modal-header">
          <h3>{{ title }}</h3>
          <button type="button" class="close-btn" [attr.aria-label]="'CLOSE' | translate" (click)="close()">&times;</button>
        </div>
      }

      <div class="modal-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
