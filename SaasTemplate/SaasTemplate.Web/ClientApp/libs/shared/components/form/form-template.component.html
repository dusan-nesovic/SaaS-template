<div class="auth-shell">
  <div class="auth-inner">
    <a class="auth-brand" routerLink="/">
      <span class="auth-brand-mark" aria-hidden="true">S</span>
      <span class="auth-brand-name">SaaS Template</span>
    </a>

    <section class="auth-card">
      <header class="auth-head">
        <h1>{{ title }}</h1>
        @if (subtitle) {
          <p class="auth-subtitle">{{ subtitle }}</p>
        }
      </header>

      <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" novalidate>
        <ng-content></ng-content>
        <ng-content select="[btn]"></ng-content>
        <ng-content select="[google]"></ng-content>
      </form>
    </section>

    <ng-content select="[return]"></ng-content>
  </div>
</div>
