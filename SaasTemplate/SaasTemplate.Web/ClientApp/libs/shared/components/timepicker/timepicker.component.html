<div class="tp-wrap" [class.tp-open]="isOpen" [class.open-up]="openUpward && isOpen">

  <!-- Trigger -->
  <div
    class="tp-trigger"
    role="button"
    tabindex="0"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen"
    (click)="toggle()"
    (keydown.enter)="toggle()"
    (keydown.space)="$event.preventDefault(); toggle()">
    <i class="pi pi-clock tp-icon"></i>
    <span class="tp-value" [class.tp-placeholder]="selectedHour === null">
      {{ displayValue || displayPlaceholder }}
    </span>
    <i class="pi pi-chevron-down tp-arrow"></i>
  </div>

  <!-- Panel -->
  <div class="tp-panel" *ngIf="isOpen">
    <div class="tp-cols">

      <!-- Hours -->
      <ul class="tp-list" role="listbox">
        <li *ngFor="let h of hours"
            class="tp-item"
            role="option"
            tabindex="0"
            [attr.aria-selected]="h === selectedHour"
            [class.tp-item--active]="h === selectedHour"
            (click)="pickHour(h)"
            (keydown.enter)="pickHour(h)">
          {{ padNum(h) }}
        </li>
      </ul>

      <div class="tp-colon">:</div>

      <!-- Minutes -->
      <ul class="tp-list" role="listbox">
        <li *ngFor="let m of minutes"
            class="tp-item"
            role="option"
            tabindex="0"
            [attr.aria-selected]="m === selectedMinute"
            [class.tp-item--active]="m === selectedMinute"
            (click)="pickMinute(m)"
            (keydown.enter)="pickMinute(m)">
          {{ padNum(m) }}
        </li>
      </ul>

    </div>

    <div class="tp-footer">
      <button type="button" class="btn primary" (click)="confirm()">{{ 'OK' | translate }}</button>
    </div>
  </div>

</div>
